# Interactive Wand Configuration
# Edit these values to customize your setup

project:
  name: "Interactive Wand"
  version: "1.0.0"

hardware:
  # LED Strip Configuration
  led:
    enabled: false  # Set to true when LED strip is connected
    count: 30
    timing: 800  # 800 for WS2812B
    spi_device: "/dev/spidev0.0"
    gpio_pin: 19  # GPIO10/MOSI for Pi 5

  # Camera Configuration
  camera:
    resolution: [640, 480]
    exposure_time: 8000  # microseconds
    analogue_gain: 6.0
    brightness: -0.3

  # Servo Configuration (optional)
  servo:
    enabled: false  # Set to true if using servo
    gpio_pin: 12
    min_pulse_width: 0.0005
    max_pulse_width: 0.0025

  # IR Illuminator (optional)
  ir_illuminator:
    enabled: false  # Set to true if using PWM control
    gpio_pin: 18
    pwm_frequency: 1000

detection:
  # Wand type: "led" (active IR LED) or "reflector" (passive Universal Studios wands)
  wand_type: "led"

  # Blob Detector Parameters (for LED mode)
  blob_detector:
    min_threshold: 180
    max_threshold: 255
    min_area: 15
    max_area: 500
    min_circularity: 0.75
    min_inertia_ratio: 0.3

  # Gesture Detection Thresholds
  gesture:
    presence_duration: 0.6  # seconds
    stillness_duration: 1.0  # seconds
    movement_threshold: 6  # pixels

  # Reflector mode configuration (for passive IR reflector wands)
  reflector:
    # MOG2 background subtraction - isolates moving reflections
    mog2:
      history: 120          # Frames of history (~2 sec at 60fps)
      var_threshold: 25     # Lower = more sensitive to changes
      learning_rate: -1     # -1 = auto, or 0.001-0.01 for manual

    # Relaxed blob detector for dimmer/irregular reflections
    blob_detector:
      min_threshold: 80     # Much lower for dim reflectors
      max_threshold: 255
      min_area: 10
      max_area: 800
      min_circularity: 0.4  # Relaxed for irregular shapes
      min_inertia_ratio: 0.2

    # Kalman filter smoothing
    kalman:
      process_noise: 0.03       # Motion model trust
      measurement_noise: 0.5    # Detection trust (higher = less)
      max_jump_distance: 100    # Pixels - reject outliers beyond this

    # Temporal validation
    temporal:
      required_frames: 3    # Consecutive detections needed

audio:
  background_volume: 0.6  # 0.0 to 1.0
  spell_volume: 1.0

paths:
  # Relative paths from project root
  sounds_dir: "Sounds"
  model_file: "new_custom_classifier.pkl"
  lastframe_file: "lastframe.jpg"
  dataset_dir: "DatasetCreation"
