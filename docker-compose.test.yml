version: '3.8'

services:
  # Syntax and import validation
  test-syntax:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-syntax
    command: python3 tests/test_syntax.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  # Configuration validation
  test-config:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-config
    command: python3 tests/test_config.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  # Utils module testing
  test-utils:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-utils
    command: python3 tests/test_utils.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  # Documentation validation
  test-docs:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-docs
    command: python3 tests/test_documentation.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  # GPIO configuration validation
  test-gpio:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-gpio
    command: python3 tests/test_gpio_config.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  # Hardware mock unit tests
  test-mocks:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-mocks
    command: python3 tests/test_hardware_mocks.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - TEST_MODE=docker

  # Animation logic tests with mocks
  test-animations:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-animations
    command: python3 tests/test_animations_mocked.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - TEST_MODE=docker

  # All tests combined
  test-all:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: wand-test-all
    command: python3 tests/run_all_tests.py
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - TEST_MODE=docker
